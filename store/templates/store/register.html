{% extends 'store/base.html' %}
{% block title %}Register — Adaptive Bookshop{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo"><h2>Create Account</h2><p>Join thousands of book lovers today</p></div>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group"><label>Username</label><input type="text" name="username" placeholder="Choose a username" required></div>
            <div class="form-group"><label>Email Address</label><input type="email" name="email" placeholder="Enter your email" required></div>
            <div class="form-group"><label>Password</label><input type="password" name="password" placeholder="Create a strong password" required></div>
            <div class="form-group"><label>Confirm Password</label><input type="password" name="password2" placeholder="Repeat your password" required></div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Create Account →</button>
        </form>
        <div class="auth-link">Already have an account? <a href="{% url 'login' %}">Sign in here</a></div>
    </div>
</div>
{% endblock %}
