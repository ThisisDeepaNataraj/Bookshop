{% extends 'store/base.html' %}
{% block title %}Login — Adaptive Bookshop{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo"><h2>Welcome Back</h2><p>Sign in to your account</p></div>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group"><label>Username</label><input type="text" name="username" placeholder="Enter your username" required></div>
            <div class="form-group"><label>Password</label><input type="password" name="password" placeholder="Enter your password" required></div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Sign In →</button>
        </form>
        <div class="auth-link">Don't have an account? <a href="{% url 'register' %}">Create one here</a></div>
    </div>
</div>
{% endblock %}
